<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Speech Synthesis</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #3BC1AC;
      font-family: sans-serif;
    }
    .voiceinator {
      width: 50rem;
      max-width: 95%;
      background: white;
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
      padding-bottom: 2rem;
    }
    h1 {
      background: #ffc600;
      margin: 0 0 2rem 0;
      padding: 1.5rem;
      text-align: center;
      font-size: 3rem;
      font-family: cursive;
    }
    .voiceinator select,
    .voiceinator input,
    .voiceinator textarea,
    .voiceinator button {
      display: block;
      width: calc(100% - 4rem);
      margin: 1rem 2rem;
      box-sizing: border-box;
      font-size: 1.2rem;
    }
    .voiceinator select,
    .voiceinator textarea {
      background: #f7f7f7;
      border: 0;
      padding: 1rem;
    }
    .voiceinator textarea {
      height: 15rem;
      font-family: monospace;
    }
    .voiceinator label {
      display: block;
      margin: 0 2rem;
      font-size: 0.9rem;
    }
    .buttons {
      display: flex;
      margin: 0 2rem;
      gap: 1rem;
    }
    .buttons button {
      width: 50%;
      margin: 0;
      padding: 1.5rem;
      background: #ffc600;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }
    #message {
      color: red;
      margin: 0 2rem;
    }
  </style>
</head>
<body>

  <div class="voiceinator">
    <h1>The Voiceinator 5000</h1>

    <select name="voice" id="voices">
      <option value="">Select A Voice</option>
    </select>
    <p id="message"></p>

    <label for="rate">Rate:</label>
    <input name="rate" id="rate" type="range" min="0" max="3" value="1" step="0.1">

    <label for="pitch">Pitch:</label>
    <input name="pitch" id="pitch" type="range" min="0" max="2" value="1" step="0.1">

    <textarea name="text" id="text">Hello! I love JavaScript 👍</textarea>

    <div class="buttons">
      <button id="stop">Stop!</button>
      <button id="speak">Speak</button>
    </div>
  </div>
<script>
  const msg = new SpeechSynthesisUtterance();
  let voices = [];

  const voicesDropdown = document.querySelector('#voices');
  const rateInput = document.querySelector('#rate');
  const pitchInput = document.querySelector('#pitch');
  const textInput = document.querySelector('#text');
  const speakButton = document.querySelector('#speak');
  const stopButton = document.querySelector('#stop');
  const message = document.querySelector('#message');

  msg.text = textInput.value;
  msg.rate = rateInput.value;
  msg.pitch = pitchInput.value;

  // Voices dropdown mein daalo
  function populateVoices() {
    voices = window.speechSynthesis.getVoices();

    if (voices.length === 0) {
      message.textContent = 'No voices available in this browser.';
      return;
    }

    message.textContent = '';
    voicesDropdown.innerHTML = voices
      .map(voice => `<option value="${voice.name}">${voice.name} (${voice.lang})</option>`)
      .join('');
    msg.voice = voices[0];
  }

  // Speak: text bolna shuru karo
  function speak() {
    msg.text = textInput.value;
    msg.rate = rateInput.value;
    msg.pitch = pitchInput.value;

    if (msg.text.trim() === '') {
      message.textContent = 'Please enter some text to speak.';
      return;
    }
    message.textContent = '';

    window.speechSynthesis.cancel();   // purani speech band
    window.speechSynthesis.speak(msg); // nayi speech shuru
  }

  // Stop: speech turant band
  function stop() {
    window.speechSynthesis.cancel();
  }

  // Voice badli: nayi voice se dobara bolo
  function setVoice() {
    msg.voice = voices.find(voice => voice.name === this.value);
    speak();
  }

  // Rate slider: nayi speed set karke dobara bolo
  function setRate() {
    msg.rate = rateInput.value;
    speak();
  }

  // Pitch slider: naya tone set karke dobara bolo
  function setPitch() {
    msg.pitch = pitchInput.value;
    speak();
  }

  populateVoices();
  window.speechSynthesis.addEventListener('voiceschanged', populateVoices);

  voicesDropdown.addEventListener('change', setVoice);
  rateInput.addEventListener('change', setRate);
  pitchInput.addEventListener('change', setPitch);
  speakButton.addEventListener('click', speak);
  stopButton.addEventListener('click', stop);
</script>

</body>
</html>
