<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Speech Synthesis</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #3BC1AC;
      font-family: sans-serif;
    }
    .voiceinator {
      width: 50rem;
      max-width: 95%;
      background: white;
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
      padding-bottom: 2rem;
    }
    h1 {
      background: #ffc600;
      margin: 0 0 2rem 0;
      padding: 1.5rem;
      text-align: center;
      font-size: 3rem;
      font-family: cursive;
    }
    .voiceinator select,
    .voiceinator input,
    .voiceinator textarea,
    .voiceinator button {
      display: block;
      width: calc(100% - 4rem);
      margin: 1rem 2rem;
      box-sizing: border-box;
      font-size: 1.2rem;
    }
    .voiceinator select,
    .voiceinator textarea {
      background: #f7f7f7;
      border: 0;
      padding: 1rem;
    }
    .voiceinator textarea {
      height: 15rem;
      font-family: monospace;
    }
    .voiceinator label {
      display: block;
      margin: 0 2rem;
      font-size: 0.9rem;
    }
    .buttons {
      display: flex;
      margin: 0 2rem;
      gap: 1rem;
    }
    .buttons button {
      width: 50%;
      margin: 0;
      padding: 1.5rem;
      background: #ffc600;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }
    #message {
      color: red;
      margin: 0 2rem;
    }
  </style>
</head>
<body>

  <div class="voiceinator">
    <h1>The Voiceinator 5000</h1>

    <select name="voice" id="voices">
      <option value="">Select A Voice</option>
    </select>
    <p id="message"></p>

    <label for="rate">Rate:</label>
    <input name="rate" id="rate" type="range" min="0" max="3" value="1" step="0.1">

    <label for="pitch">Pitch:</label>
    <input name="pitch" id="pitch" type="range" min="0" max="2" value="1" step="0.1">

    <textarea name="text" id="text">Hello! I love JavaScript 👍</textarea>

    <div class="buttons">
      <button id="stop">Stop!</button>
      <button id="speak">Speak</button>
    </div>
  </div>
<script>
  const synth = window.speechSynthesis;
  const voicesDropdown = document.querySelector('#voices');
  const rateInput = document.querySelector('#rate');
  const pitchInput = document.querySelector('#pitch');
  const textInput = document.querySelector('#text');
  const speakButton = document.querySelector('#speak');
  const stopButton = document.querySelector('#stop');
  const message = document.querySelector('#message');

  let voices = [];

  // 1. Voices load karke dropdown mein daalo
  function populateVoices() {
    voices = synth.getVoices();

    if (!voices || voices.length === 0) {
      message.textContent = 'No voices available in this browser.';
      return;
    }

    message.textContent = '';
    const selected = voicesDropdown.value;
    voicesDropdown.innerHTML = '';

    voices.forEach(function (voice) {
      const option = document.createElement('option');
      option.value = voice.name;
      option.textContent = voice.name + ' (' + voice.lang + ')';
      voicesDropdown.appendChild(option);
    });

    if (selected) voicesDropdown.value = selected;
  }

  // 2. Har baar nayi utterance banao (current text, voice, rate, pitch ke saath)
  function speak() {
    const text = textInput.value.trim();

    if (text === '') {
      message.textContent = 'Please enter some text to speak.';
      return;
    }
    message.textContent = '';

    synth.cancel(); // pehle wali speech band

    const utterance = new SpeechSynthesisUtterance(text);
    const selectedVoice = voices.find(v => v.name === voicesDropdown.value);
    if (selectedVoice) utterance.voice = selectedVoice;
    utterance.rate = parseFloat(rateInput.value);
    utterance.pitch = parseFloat(pitchInput.value);

    synth.speak(utterance);
  }

  // 3. Stop
  function stop() {
    synth.cancel();
  }

  // 4. Voice / rate / pitch badle aur speech chal rahi ho to nayi setting se restart
  function restartIfSpeaking() {
    if (synth.speaking) {
      speak();
    }
  }

  // Voices kabhi turant, kabhi baad mein load hoti hain
  populateVoices();
  if (synth.onvoiceschanged !== undefined) {
    synth.onvoiceschanged = populateVoices;
  }
  setTimeout(populateVoices, 500);

  speakButton.addEventListener('click', speak);
  stopButton.addEventListener('click', stop);
  voicesDropdown.addEventListener('change', restartIfSpeaking);
  rateInput.addEventListener('input', restartIfSpeaking);
  rateInput.addEventListener('change', restartIfSpeaking);
  pitchInput.addEventListener('input', restartIfSpeaking);
  pitchInput.addEventListener('change', restartIfSpeaking);
</script>

</body>
</html>
